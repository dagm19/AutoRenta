services:
    web:
        build:
            context: .
            dockerfile: ./autorenta_project/Dockerfile
            args:
            - --no-cache
        ports:
        - "8000:80"
        depends_on:
            db:
                condition: service_healthy
        env_file:
        - .env
        restart: always
    db:
        image: postgres:16
        ports:
        - "5440:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 20s
            timeout: 30s
            retries: 5
            start_period: 30s
        volumes:
        - postgres_data:/var/lib/postgresql/data/
        environment:
        - POSTGRES_DB=autorenta
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres
        restart: always

volumes:
    postgres_data: