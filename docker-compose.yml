services:
    web:
        build:
            context: .
            dockerfile: ./autorenta_project/Dockerfile
            args:
            - --no-cache
        ports:
        - "8000:80"
        depends_on:
        - db
        env_file:
        - .env
        restart: always
    db:
        image: postgres:16
        ports:
        - "5440:5432"
        volumes:
        - postgres_data:/var/lib/postgresql/data/
        environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=postgres
        - POSTGRES_DB=postgres
        restart: always

volumes:
    postgres_data: